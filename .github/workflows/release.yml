name: Release

# A tag like v0.2.0 builds Perch, signs it with the "Perch Code Signing"
# certificate, packages a DMG and a zip, and publishes a GitHub release.
# Run it by hand (Actions > Release > Run workflow) for a dry run: it builds,
# signs and uploads the files as an artifact, without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dryrun.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Perch $VERSION (build $GITHUB_RUN_NUMBER)"

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.PERCH_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.PERCH_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/perch.p12"
          security import "$RUNNER_TEMP/perch.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/perch.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KEYCHAIN" | grep "Perch Code Signing"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: |
          set -o pipefail
          xcodegen generate
          mkdir -p build
          xcodebuild build \
            -scheme Perch \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="Perch Code Signing" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN --timestamp=none" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            > build/release.log 2>&1 || {
              grep -nE 'error:|Stack dump|Please submit|While (evaluating|emitting|silgen|type-checking)|\*\* BUILD' build/release.log | head -40
              grep -B3 -A25 'Stack dump' build/release.log | head -80
              exit 1
            }
          grep -E 'warning:|\*\* BUILD' build/release.log || true
          test -d build/DerivedData/Build/Products/Release/Perch.app

      - name: Verify signature
        run: |
          APP=build/DerivedData/Build/Products/Release/Perch.app
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=Perch Code Signing"
          codesign -dvv "$APP" 2>&1 | grep -E "flags=.*runtime"

      - name: Package
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP=build/DerivedData/Build/Products/Release/Perch.app
          mkdir -p dist/dmg
          ditto -c -k --keepParent "$APP" "dist/Perch-$VERSION.zip"
          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Perch $VERSION" -srcfolder dist/dmg -ov -format UDZO "dist/Perch-$VERSION.dmg"
          rm -rf dist/dmg
          (cd dist && shasum -a 256 Perch-* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload files (dry run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Perch-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 7

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Perch ${{ steps.version.outputs.version }}" \
            --generate-notes $PRERELEASE

      - name: Remove signing keychain
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
