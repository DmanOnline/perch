name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -scheme Perch \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            > build/test.log 2>&1 || { grep -E '✘|error:|\*\* TEST' build/test.log; exit 1; }
          grep -E '^(✔|✘)|\*\* TEST' build/test.log

      - name: Build release
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -scheme Perch \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            > build/release.log 2>&1 || {
              grep -nE 'error:|Stack dump|Please submit|While (evaluating|emitting|silgen|type-checking)|\*\* BUILD' build/release.log | head -40
              grep -B3 -A25 'Stack dump' build/release.log | head -80
              exit 1
            }
          grep -E 'warning:|\*\* BUILD' build/release.log || true
          test -d build/DerivedData/Build/Products/Release/Perch.app

      - name: Package app
        run: |
          cd build/DerivedData/Build/Products/Release
          ditto -c -k --keepParent Perch.app "$GITHUB_WORKSPACE/Perch.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Perch-${{ github.sha }}
          path: Perch.zip
          retention-days: 14
