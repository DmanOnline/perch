name: Something is wrong
description: Perch crashes, disappears, shows the wrong thing or feels off.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. The more exact, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Perch did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Play music in Spotify
        2. Plug in the charger
        3. ...
  - type: input
    id: perch
    attributes:
      label: Perch version
      description: Settings › About.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      description: Model, and any external screens.
      placeholder: "MacBook Air M3, plus an external 4K screen"
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: Drag a file in here. A short screen recording helps most with animation problems.
