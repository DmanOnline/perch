<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Perch app icon, direction A: an amber bird perched on a black Dynamic Island.
       macOS grid: a 412 squircle in a 512 canvas (824 in 1024), room for the shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2238"/>
      <stop offset="0.62" stop-color="#6b3a44"/>
      <stop offset="1" stop-color="#e0894a"/>
    </linearGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb224"/>
    </linearGradient>
    <filter id="island" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g transform="translate(50 46)">
    <rect width="412" height="412" rx="92" fill="url(#bg)" filter="url(#tile)"/>
    <g filter="url(#island)">
      <rect x="86" y="236" width="240" height="64" rx="32" fill="#000"/>
    </g>
    <g transform="translate(150 106) scale(1.25)" fill="url(#bird)">
      <ellipse cx="48" cy="62" rx="27" ry="21"/>
      <circle cx="71" cy="38" r="14"/>
      <polygon points="83,34 98,39 83,45"/>
      <polygon points="26,58 2,44 10,70"/>
      <rect x="42" y="78" width="5" height="22" rx="2.5"/>
      <rect x="55" y="78" width="5" height="22" rx="2.5"/>
    </g>
    <circle cx="242" cy="148" r="3.6" fill="#2a2238"/>
  </g>
</svg>
